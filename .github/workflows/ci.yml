name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-audit:
    name: Lint & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Run TypeScript Typecheck
        run: npm run lint

      - name: Run ESLint
        run: npm run lint:eslint

  test-and-coverage:
    name: Test Suite & Coverage Thresholds
    runs-on: ubuntu-latest
    needs: [lint-and-audit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Tests with Coverage Check
        env:
          NODE_ENV: test
        run: npm run test:coverage

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [test-and-coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build
